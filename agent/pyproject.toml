[project]
name = "agent"
version = "0.1.0"
description = "Text2SQL Agent Service"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.32.1",
    "langgraph",
    "langchain-ollama",
    "core",
    "esca-sdk",
    "pydantic-settings>=2.7.0",
    "trino>=0.328.0",
    "langfuse>=2.0.0",
    "langchain",
    "langchain-openai",
    "greenlet>=3.5.1",
    "mcp>=1.12.4",
    "networkx>=3.3",
]

[tool.uv.sources]
core = { path = "../core" }
esca-sdk = { git = "https://github.com/elirazpevz/esca.git", subdirectory = "packages/esca-sdk" }

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.3.0",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["TID"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"langchain_openai.ChatOpenAI" = { msg = "Use get_llm from agent.llm instead of instantiating ChatOpenAI directly." }
"esca_sdk.EscaClient" = { msg = "Use get_esca_client from agent.utils.esca instead of instantiating EscaClient directly." }

[tool.ruff.lint.per-file-ignores]
"src/agent/llm.py" = ["TID251"]
"src/agent/utils/esca.py" = ["TID251"]

[tool.pytest.ini_options]
testpaths = ["tests"]
