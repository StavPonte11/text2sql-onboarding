      WEB_CONF_XSS_PROTECTION_ON: ${WEB_CONF_XSS_PROTECTION_ON:-true}
      WEB_CONF_XSS_PROTECTION_BLOCK: ${WEB_CONF_XSS_PROTECTION_BLOCK:-true}
      WEB_CONF_XSS_CSP_ENABLED: ${WEB_CONF_XSS_CSP_ENABLED:-false}
      WEB_CONF_XSS_CSP_POLICY: ${WEB_CONF_XSS_CSP_POLICY:-"default-src 'self'"}
      WEB_CONF_XSS_CSP_REPORT_ONLY_POLICY: ${WEB_CONF_XSS_CSP_REPORT_ONLY_POLICY:-""}
      WEB_CONF_CACHE_CONTROL: ${WEB_CONF_CACHE_CONTROL:-""}
      WEB_CONF_PRAGMA: ${WEB_CONF_PRAGMA:-""}
    expose:
    - 8585
    - 8586
    ports:
    - 8585:8585
    - 8586:8586
    depends_on:
      elasticsearch:
        condition: service_healthy
      mysql:
        condition: service_healthy
      execute-migrate-all:
        condition: service_completed_successfully
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - --spider
      - http://localhost:8586/healthcheck
  ingestion:
    container_name: openmetadata_ingestion
    image: docker.getcollate.io/openmetadata/ingestion:1.6.1
    depends_on:
      elasticsearch:
        condition: service_started
      mysql:
        condition: service_healthy
      openmetadata-server:
        condition: service_started
    environment:
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__OPENMETADATA_AIRFLOW_APIS__DAG_GENERATED_CONFIGS: /opt/airflow/dag_generated_configs
      DB_HOST: ${AIRFLOW_DB_HOST:-mysql}
      DB_PORT: ${AIRFLOW_DB_PORT:-3306}
      AIRFLOW_DB: ${AIRFLOW_DB:-airflow_db}
      DB_SCHEME: ${AIRFLOW_DB_SCHEME:-mysql+pymysql}
      DB_USER: ${AIRFLOW_DB_USER:-airflow_user}
      DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:-airflow_pass}
      DB_PROPERTIES: ${AIRFLOW_DB_PROPERTIES:-}
    entrypoint: /bin/bash
    command:
    - /opt/airflow/ingestion_dependency.sh
    expose:
    - 8080
    ports:
    - 8082:8080
    volumes:
    - ingestion-volume-dag-airflow:/opt/airflow/dag_generated_configs
    - ingestion-volume-dags:/opt/airflow/dags
    - ingestion-volume-tmp:/tmp

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
      secrets:
        - deploy_key
    # command: sh -c "python -m app.seed && python -m app.infra_init && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/text2sql
      - POSTGRES_HOST=db
      - TRINO_HOST=trino
      - TRINO_PORT=8080
      - TRINO_USER=trino
      - TRINO_PASSWORD=
      - TRINO_CATALOG=minio
      - TRINO_SCHEMA=simple_retail
      - TRINO_HTTP_SCHEME=http
      - TRINO_REQUEST_TIMEOUT=30.0
      - TRINO_ENABLED=true
      - OPENMETADATA_URL=http://openmetadata-server:8585
      - OPENMETADATA_SERVICE_NAME=local_trino
      - APP_ENV=production
      - JWT_SECRET=dev-secret-change-in-production
      - LANGFUSE_PUBLIC_KEY=pk-lf-4d50ba92-b9b2-48bf-a395-3335e069fd2c
      - LANGFUSE_SECRET_KEY=sk-lf-0a4d3df1-573b-47a3-b534-52b59ba1bf8a
      - LANGFUSE_HOST=https://cloud.langfuse.com
    depends_on:
      db:
        condition: service_healthy
      trino:
        condition: service_healthy
      openmetadata-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  agent:
    build:
      context: .
      dockerfile: ./agent/Dockerfile
      secrets:
        - deploy_key
    env_file:
      - ./agent/.env
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/text2sql
      - POSTGRES_HOST=db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=text2sql
      - REDIS_URL=redis://redis:6379
      - REDIS_SSL=false
      - LLM_BASE_URL=http://host.docker.internal:11434/v1
      - LLM_MODEL=gemma4:e4b
      - LLM_API_KEY=ollama
      - EMBEDDER_URL=http://host.docker.internal:11434
      - EMBEDDER_MODEL=nomic-embed-text:latest
      - ESCA_URL=http://host.docker.internal:7010
      - TRINO_HOST=trino
      - TRINO_PORT=8080
      - TRINO_USER=trino
      - TRINO_PASSWORD=
      - TRINO_CATALOG=minio
      - TRINO_SCHEMA=simple_retail
      - TRINO_HTTP_SCHEME=http
      - TRINO_REQUEST_TIMEOUT=30.0
      - TRINO_ENABLED=true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      trino:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:8080"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pg_data: null
  minio_data: null
  ingestion-volume-dag-airflow: null
  ingestion-volume-dags: null
  ingestion-volume-tmp: null
  es-data: null
  db-data: null

secrets:
  deploy_key:
    file: ./deploy_key

