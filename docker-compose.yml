x-shared-db-env: &shared-db-env
  DATABASE_URL: postgresql://postgres:postgres@db:5432/text2sql
  POSTGRES_HOST: db
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_PORT: 5432
  POSTGRES_DB: text2sql
  TRINO_HOST: trino
  TRINO_PORT: 8080
  TRINO_USER: trino
  TRINO_PASSWORD: ""
  TRINO_CATALOG: minio
  TRINO_SCHEMA: simple_retail
  TRINO_HTTP_SCHEME: http
  TRINO_REQUEST_TIMEOUT: 600.0
  TRINO_ENABLED: "true"

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: text2sql
    ports:
      - 5432:5432
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d text2sql" ]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
  minio:
    image: minio/minio:RELEASE.2023-11-20T22-40-07Z
    ports:
      - 9000:9000
      - 9001:9001
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
  trino:
    image: trinodb/trino:443
    ports:
      - 8080:8080
    volumes:
    - ./infra/trino/etc/catalog:/etc/trino/catalog
    - ./infra/trino/etc/jvm.config:/etc/trino/jvm.config
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/v1/info" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
  temporal:
    image: temporalio/auto-setup:1.24.2
    ports:
      - "7233:7233"
      - "8233:8233"
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PWD=postgres
      - POSTGRES_SEEDS=db
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  temporal-ui:
    image: temporalio/ui:2.52.1
    ports:
      - "8088:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
      - TEMPORAL_CSRF_COOKIE_INSECURE=true # dev only
    depends_on:
      temporal:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: ./worker/Dockerfile
      secrets:
        - deploy_key
    command: python -m app.main
    env_file:
      - ./worker/.env
    environment:
      <<: *shared-db-env
      TEMPORAL_HOST: temporal:7233
      LLM_BASE_URL: http://host.docker.internal:11434/v1
      LLM_MODEL: gemma4:e4b
      LLM_API_KEY: ollama
      ACTIVITY_START_TO_CLOSE_TIMEOUT_SECONDS: 600
    depends_on:
      db:
        condition: service_healthy
      temporal:
        condition: service_started

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
      secrets:
        - deploy_key
    command: sh -c "python -m app.seed && python -m app.infra_init && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    environment:
      <<: *shared-db-env
      APP_ENV: production
      JWT_SECRET: dev-secret-change-in-production
      AGENT_URL: http://agent:8001
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_HOST: ${LANGFUSE_HOST}
      ENABLE_GOOGLE: ${ENABLE_GOOGLE}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      ENABLE_KEYCLOAK: ${ENABLE_KEYCLOAK}
      KEYCLOAK_SERVER_URL: ${KEYCLOAK_SERVER_URL}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      FRONTEND_DEFAULT_REDIRECT: ${FRONTEND_DEFAULT_REDIRECT}
      SSO_REDIRECT_URI: ${SSO_REDIRECT_URI}
      MINIO_HOST: minio:9000
      MINIO_ACCESS_KEY: admin
      MINIO_SECRET_KEY: password123
      REDIS_URL: redis://redis:6379
      REDIS_SSL: "false"
      TEMPORAL_HOST: temporal:7233
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
      trino:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 300s
    volumes:
      - ./core:/app/core
      - ./backend:/app/backend
      - /app/backend/.venv
      - ./certs/azure-trino-certs:/app/azure-trino-certs:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "evaluation-service:host-gateway"
  agent:
    build:
      context: .
      dockerfile: ./agent/Dockerfile
      secrets:
        - deploy_key
    env_file:
      - ./agent/.env
    ports:
      - "8001:8001"
    volumes:
      - ./core:/app/core
      - ./agent:/app/agent
      - /app/agent/.venv
      - ./certs/azure-trino-certs:/app/azure-trino-certs:ro
    environment: 
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/text2sql
      - POSTGRES_HOST=db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=text2sql
      - REDIS_URL=redis://redis:6379
      - REDIS_SSL=false
      # - LLM_BASE_URL=http://host.docker.internal:11434/v1
      # - LLM_MODEL=gemma4:e4b
      # - LLM_API_KEY=ollama
      - LLM_API_KEY=sk-pj7x2rp8o2tli9
      - LLM_BASE_URL=https://pj7x2rp8o2tli9-8000.proxy.runpod.net/v1
      - LLM_MODEL=openai/gpt-oss-120b
      - JEEN_LLM_CORE_URL=http://schema-modeler.dev161.internal/api/mcp
      - JEEN_API_KEY=mcp_d61337a926f6b1e1c88218994c731c28d64ff925918a2dd384c89db1383ee7e3
      - EMBEDDER_URL=http://host.docker.internal:11434/v1/embeddings
      - EMBEDDER_MODEL=nomic-embed-text:latest
      - ESCA_URL=http://host.docker.internal:7010
      - ESCA_WRITE_ENABLED=false
      - MAX_PROFILES_TO_FETCH=10
      - HYBRID_SEARCH_MAX_TABLES=15
      - TRINO_HOST=trino.dev161.internal
      - TRINO_PORT=443
      - TRINO_USER=schema-modeler
      - TRINO_PASSWORD=
      - TRINO_CATALOG=adventureworks
      - TRINO_SCHEMA=public
      - TRINO_HTTP_SCHEME=https
      - TRINO_REQUEST_TIMEOUT=30.0
      - TRINO_ENABLED=true
      - TRINO_CERT_PATH=/app/azure-trino-certs/trino-client-crt
      - TRINO_KEY_PATH=/app/azure-trino-certs/trino-client-key    
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      trino:
        condition: service_healthy
    networks:
      - default
      - shared-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:8080"
    environment:
      - BACKEND_URL=http://backend:8000
      - AGENT_URL=http://agent:8001
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pg_data: null
  minio_data: null

secrets:
  deploy_key:
    file: ./deploy_key

networks:
  shared-net:
    external: true