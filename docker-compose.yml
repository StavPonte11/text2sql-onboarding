services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: text2sql
    ports:
    - 5432:5432
    volumes:
    - pg_data:/var/lib/postgresql/data
    - ./backend/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d text2sql"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
  minio:
    image: minio/minio:RELEASE.2023-11-20T22-40-07Z
    ports:
    - 9000:9000
    - 9001:9001
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    command: server /data --console-address ":9001"
    volumes:
    - minio_data:/data
  trino:
    image: trinodb/trino:435
    ports:
    - 8080:8080
    volumes:
    - ./infra/trino/etc/catalog:/etc/trino/catalog
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/info"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
  mysql:
    container_name: openmetadata_mysql
    image: docker.getcollate.io/openmetadata/db:1.6.1
    command: --sort_buffer_size=10M
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
    expose:
    - 3306
    ports:
    - 3306:3306
    volumes:
    - db-data:/var/lib/mysql
    healthcheck:
      test: mysql --user=root --password=$$MYSQL_ROOT_PASSWORD --silent --execute
        "use openmetadata_db"
      interval: 15s
      timeout: 10s
      retries: 10
  elasticsearch:
    container_name: openmetadata_elasticsearch
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.4
    environment:
    - discovery.type=single-node
    - ES_JAVA_OPTS=-Xms1024m -Xmx1024m
    - xpack.security.enabled=false
    ports:
    - 9200:9200
    - 9300:9300
    healthcheck:
      test: curl -s http://localhost:9200/_cluster/health?pretty | grep status | grep
        -qE 'green|yellow' || exit 1
      interval: 15s
      timeout: 10s
      retries: 10
    volumes:
    - es-data:/usr/share/elasticsearch/data
  execute-migrate-all:
    container_name: execute_migrate_all
    image: docker.getcollate.io/openmetadata/server:1.6.1
    command: ./bootstrap/openmetadata-ops.sh migrate
    environment:
      OPENMETADATA_CLUSTER_NAME: ${OPENMETADATA_CLUSTER_NAME:-openmetadata}
      SERVER_PORT: ${SERVER_PORT:-8585}
